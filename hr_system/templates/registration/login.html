{% extends "base.html" %}

{% block title %}Employee Login{% endblock %}

{% block nav %}
    <nav class="nav"><a href="{% url 'index' %}">🏠 Home</a></nav>
{% endblock %}

{% block content %}
<div class="card narrow auth">
    <div class="auth-art">
        <!-- Animated lock / shield -->
        <svg viewBox="0 0 120 120" aria-hidden="true">
            <defs>
                <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#00d4ff"/><stop offset="1" stop-color="#7c5cff"/>
                </linearGradient>
            </defs>
            <circle cx="60" cy="60" r="54" fill="#7c5cff" opacity=".25">
                <animate attributeName="r" values="50;56;50" dur="3s" repeatCount="indefinite"/>
            </circle>
            <path d="M60 14 L98 28 V58 C98 84 80 100 60 108 C40 100 22 84 22 58 V28 Z" fill="url(#shield)"/>
            <rect x="42" y="56" width="36" height="28" rx="6" fill="#fff"/>
            <path d="M48 56 V48 a12 12 0 0 1 24 0 V56" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
            <circle cx="60" cy="68" r="4" fill="#7c5cff"/>
            <rect x="58" y="68" width="4" height="9" rx="2" fill="#7c5cff"/>
        </svg>
    </div>

    <h2>Employee <span class="grad">Login</span> 🔐</h2>
    <p>Welcome back! Sign in to manage your time off.</p>
    <hr>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn full">Log In</button>
    </form>

    <!-- Add this new line below the form! -->
    <p class="auth-switch">Don't have an account? <a href="{% url 'register' %}">Register here</a>.</p>
</div>
{% endblock %}
