{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Company HR System{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <div class="dots"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>

    <header class="topbar">
        <div class="brand">
            <svg viewBox="0 0 48 48" aria-hidden="true">
                <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00d4ff"/><stop offset="1" stop-color="#7c5cff"/></linearGradient></defs>
                <rect x="4" y="4" width="40" height="40" rx="12" fill="url(#lg)"/>
                <circle cx="24" cy="18" r="6" fill="#fff"/>
                <path d="M12 36c1-8 7-11 12-11s11 3 12 11" fill="#fff"/>
            </svg>
            <span>Company <span class="grad">HR</span> Portal</span>
        </div>
        {% block nav %}{% endblock %}
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
